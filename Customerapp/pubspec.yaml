name: customer_app
description: "GreenGrocc customer app — Flutter port of the greengrocc.in storefront."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_dotenv: ^6.0.0
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  razorpay_flutter: ^1.4.0
  image_picker: ^1.2.0
  image_picker_android: ^0.8.13+17
  image_picker_platform_interface: ^2.11.0
  connectivity_plus: ^7.0.0
  pdf: ^3.11.3
  path_provider: ^2.1.5
  app_links: ^6.4.1
  flutter_svg: ^2.2.0
  package_info_plus: ^8.3.0
  video_player: ^2.11.1
  audioplayers: ^6.7.1
  gal: ^2.3.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon_launcher.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon_launcher.png
  adaptive_icon_foreground_inset: 8
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/favicon.png
    - assets/images/greengrocc_logo.png
    - assets/images/app_logo.png
    - assets/images/splash_logo.png
    - assets/images/whatsapp.svg
    - assets/images/payment/
    - assets/sounds/
